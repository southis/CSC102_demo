    <!-- Header section  -->

    <!-- Navigation menu (consistent with other pages) -->

        <a href="./index.html">Home</a><br>

        <a href="./boards.html">Boards</a><br>

    <!-- Content area -->

    <div class="content">

        <h2>Enter Quark’s Arena</h2>

        <p>

            Your strength is your declaration.<br>

            The opponent’s strength is the unknown.<br>

            “Victory is never promised — only earned.”

        </p>



        <!-- 

            FORM REQUIRED BY THE ASSIGNMENT

            All user input must come through a form + submit 

        -->

        <form>

            <label for="playerStrength">

                Choose your strength (1–100):

            </label>

            <input type="number" id="playerStrength" min="1" max="100" required>



            <br><br>



            <!-- 

                Button that triggers the game through 'startDuel()'

                This button does NOT contain JavaScript inside it.

            -->

            <input type="button" value="Begin Duel" onclick="startDuel()">

        </form>



        <!-- Results will appear here via innerHTML -->

        <h2>Results</h2>

        <p id="results">Awaiting your challenge...</p>

    </div>
